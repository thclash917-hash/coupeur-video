<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Découpeur Vidéo Shorts</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
    }
    h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #555;
    }
    input[type="file"], input[type="number"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #aaa;
    }
    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
    .error { color: #d9534f; }
    .success { color: #5cb85c; }
    .loading { color: #0275d8; }
  </style>
</head>
<body>

<div class="card">
  <h2>✂️ Découper une vidéo MP4</h2>
  <form id="cutForm">
    <div class="form-group">
      <label for="videoFile">Sélectionner la vidéo (MP4) :</label>
      <input type="file" id="videoFile" accept="video/mp4,video/*" required>
    </div>

    <div class="form-group">
      <label for="duration">Durée de l'extrait :</label>
      <select id="duration">
        <option value="15">15 secondes</option>
        <option value="30">30 secondes</option>
        <option value="60">60 secondes</option>
      </select>
    </div>

    <div class="form-group">
      <label for="startMin">Minute de début :</label>
      <input type="number" id="startMin" value="0" min="0" required>
    </div>

    <div class="form-group">
      <label for="endMin">Minute de fin :</label>
      <input type="number" id="endMin" value="10" min="1" required>
    </div>

    <button type="submit" id="submitBtn">Lancer le découpage</button>
  </form>

  <div id="status"></div>
</div>

<script>
  const API_URL = "https://coupeur-video.onrender.com/cut";

  document.getElementById("cutForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const fileInput = document.getElementById("videoFile");
    const duration = document.getElementById("duration").value;
    const startMin = document.getElementById("startMin").value;
    const endMin = document.getElementById("endMin").value;
    const submitBtn = document.getElementById("submitBtn");
    const statusDiv = document.getElementById("status");

    if (!fileInput.files[0]) {
      statusDiv.className = "error";
      statusDiv.innerText = "Veuillez sélectionner un fichier vidéo.";
      return;
    }

    const formData = new FormData();
    formData.append("file", fileInput.files[0]);
    formData.append("segment_duration", duration);
    formData.append("start_min", startMin);
    formData.append("end_min", endMin);

    submitBtn.disabled = true;
    statusDiv.className = "loading";
    statusDiv.innerText = "Envoi de la vidéo et découpage en cours...";

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        body: formData
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.detail || "Erreur lors du traitement.");
      }

      const blob = await response.blob();
      const downloadUrl = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = downloadUrl;
      a.download = `extrait_${duration}s.mp4`;
      document.body.appendChild(a);
      a.click();
      a.remove();

      statusDiv.className = "success";
      statusDiv.innerText = "Découpage réussi ! Le téléchargement a démarré.";
    } catch (err) {
      statusDiv.className = "error";
      statusDiv.innerText = "Erreur : " + err.message;
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
